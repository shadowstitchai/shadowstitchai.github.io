<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>返回纽扣纸样</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 32px 20px;
      text-align: center;
      background: #f7f7f7;
      color: #111;
      line-height: 1.5;
    }
    .card {
      max-width: 360px;
      margin: 0 auto;
      padding: 24px 20px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
    }
    a {
      display: block;
      margin-top: 24px;
      padding: 14px 20px;
      border-radius: 10px;
      background: #007aff;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 17px;
    }
    .hint {
      margin-top: 16px;
      font-size: 14px;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="card">
    <p><strong>支付宝授权已成功</strong></p>
    <p>请点击下方按钮返回纽扣纸样 App 完成登录。</p>
    <a id="openApp" href="coutto://auth/callback">返回纽扣纸样</a>
    <p class="hint">若支付宝提示页面错误，请先点「返回」回到本页，再点蓝色按钮。</p>
  </div>
  <script>
    (function () {
      var qs = window.location.search || "";
      var hash = window.location.hash || "";
      if (!qs && !hash) {
        return;
      }
      var target = "coutto://auth/callback" + qs + hash;
      document.getElementById("openApp").setAttribute("href", target);
    })();
  </script>
</body>
</html>
