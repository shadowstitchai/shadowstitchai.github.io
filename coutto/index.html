permalink: /coutto/

<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>打开纽扣纸样</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 32px 20px;
      text-align: center;
      background: #f7f7f7;
      color: #111;
      line-height: 1.5;
    }
    .card {
      max-width: 360px;
      margin: 0 auto;
      padding: 24px 20px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
    }
    a.primary {
      display: block;
      margin-top: 24px;
      padding: 14px 20px;
      border-radius: 10px;
      background: #007aff;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 17px;
    }
    a.secondary {
      display: block;
      margin-top: 12px;
      padding: 12px 20px;
      color: #007aff;
      text-decoration: none;
      font-size: 15px;
    }
    .hint {
      margin-top: 16px;
      font-size: 14px;
      color: #666;
    }
    .soon {
      margin-top: 24px;
      font-size: 15px;
      color: #444;
    }
  </style>
</head>
<body>
  <div class="card">
    <p><strong>纽扣纸样</strong></p>
    <p>在 App 中打开，或前往 App Store 下载。</p>
    {% assign store_url = site.data.jade.app_store_url | strip %}
    {% if store_url != "" %}
    <a class="primary" href="{{ store_url }}">前往 App Store</a>
    {% else %}
    <p class="soon">App 即将上架 App Store</p>
    {% endif %}
    <a class="secondary" href="coutto://">已安装？打开 App</a>
    <p class="hint">若未自动打开，请确认已安装纽扣纸样，或稍后再试。</p>
  </div>
</body>
</html>
